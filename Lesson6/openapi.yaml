openapi: 3.0.3
info:
  title: Social Network API - Authentication & Post Access
  version: 1.0.0
  description: |
    OpenAPI specification for SOA - Buoi 06 (Authentication & Authorization).
    This assignment defines exactly three endpoints: login, token refresh,
    and retrieving a post by ID.

    Security policy (assignment assumptions):
    - Access and refresh tokens are signed JWTs, issued over HTTPS.
    - Access tokens expire after 15 minutes (900 seconds).
    - Refresh tokens have a maximum lifetime of 30 days (2592000 seconds),
      are session-bound, single-use, and rotated on every successful refresh.
    - GET /posts/{id} always requires a valid access token with posts:read.
      A public post can then be read by any authenticated user holding that scope;
      a private post can be read only by its owner.
    - Revoked tokens and terminated sessions are rejected.
    - API error responses intentionally do not expose sensitive details.
servers:
  - url: https://api.social-network.example/v1
    description: Illustrative HTTPS endpoint (not a deployed service)
tags:
  - name: Authentication
    description: Login and refresh token lifecycle
  - name: Posts
    description: Read posts with scope and object-level authorization
paths:
  /auth/login:
    post:
      tags: [Authentication]
      operationId: login
      summary: Authenticate a user and issue access/refresh tokens
      description: |
        **Authentication:** Email and password are verified against a securely
        hashed password (Argon2id or suitably configured bcrypt).
        **Required scope:** None; login must be callable before obtaining a token.
        **Policy:** Use one generic response for invalid email/password; rate-limit
        repeated attempts. Never place credentials or tokens in URL/query strings.
      security: []
      x-required-scopes: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: an@example.com
              password: example-password-not-real
      responses:
        '200':
          description: Login successful; returns a token pair.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
              example:
                access_token: '<signed-access-jwt>'
                refresh_token: '<signed-refresh-jwt>'
                token_type: Bearer
                expires_in: 900
        '400':
          description: Invalid JSON body or missing/malformed required fields.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { error: invalid_request, message: Invalid request body. }
        '401':
          description: Email/password pair is invalid; do not identify which field was wrong.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { error: invalid_credentials, message: Invalid credentials. }
        '429':
          $ref: '#/components/responses/RateLimited'

  /auth/refresh:
    post:
      tags: [Authentication]
      operationId: refreshAccessToken
      summary: Exchange a valid refresh JWT for a new token pair
      description: |
        **Authentication:** Requires a refresh JWT via `Authorization: Bearer <refresh-token>`.
        An access JWT is NOT accepted on this endpoint.
        **Required scope:** None; this endpoint is restricted by token type and
        session state, rather than an application scope.
        **Rotation:** Validate JWT signature, expiry, issuer, audience (when configured),
        token type, session and revocation status; atomically invalidate the presented
        refresh token and issue a fresh access token + refresh token. Reload current
        user permissions before issuing new access claims. Reuse of a rotated refresh
        token must be detected and the related token family/session revoked.
      security:
        - RefreshTokenAuth: []
      x-required-scopes: []
      responses:
        '200':
          description: Refresh successful; old refresh token becomes unusable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
              example:
                access_token: '<new-signed-access-jwt>'
                refresh_token: '<new-signed-refresh-jwt>'
                token_type: Bearer
                expires_in: 900
        '401':
          description: |
            Missing, malformed, expired, revoked, reused, or wrong-type refresh
            token; or invalidated session. Respond generically to avoid leakage.
          headers:
            WWW-Authenticate:
              schema: { type: string }
              description: Bearer authentication challenge.
              example: Bearer
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { error: invalid_refresh_token, message: Authentication required. }
        '429':
          $ref: '#/components/responses/RateLimited'

  /posts/{id}:
    get:
      tags: [Posts]
      operationId: getPostById
      summary: Get a post by ID if scope and object policy allow it
      description: |
        **Authentication:** Valid access JWT required (`Authorization: Bearer <access-token>`).
        **Required scope:** `posts:read` (all callers, including readers of public posts).
        **Object-level authorization:** After authentication and scope verification,
        return a public post to any authenticated user with `posts:read`; return a
        private post only if `post.author_id == token.sub`. In all other cases,
        return HTTP 403. The post not existing returns HTTP 404.
        No unapproved internal properties (password hashes, moderation metadata,
        security flags) are exposed in the response DTO.
      security:
        - AccessTokenAuth: []
      x-required-scopes:
        - posts:read
      parameters:
        - name: id
          in: path
          required: true
          description: Positive integer identifier of a post.
          schema:
            type: integer
            format: int64
            minimum: 1
          example: 42
      responses:
        '200':
          description: Post found and caller authorized to read it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
              example:
                id: 42
                author_id: '12'
                content: Chao mung den voi mang xa hoi!
                visibility: public
                created_at: '2026-10-20T08:30:00Z'
        '400':
          description: ID parameter is invalid (for example a non-positive ID).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { error: invalid_post_id, message: Invalid post ID. }
        '401':
          description: Access token is absent, expired, invalid, or revoked.
          headers:
            WWW-Authenticate:
              schema: { type: string }
              description: Bearer authentication challenge.
              example: Bearer
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { error: unauthorized, message: Authentication required. }
        '403':
          description: Missing posts:read scope OR not authorized to view a private post.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                insufficientScope:
                  summary: Access token lacks posts:read.
                  value: { error: insufficient_scope, message: Permission denied. }
                forbiddenPost:
                  summary: Post exists but is private and owned by another user.
                  value: { error: forbidden, message: Permission denied. }
        '404':
          description: No post with this ID exists.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { error: post_not_found, message: Post not found. }
        '429':
          $ref: '#/components/responses/RateLimited'

components:
  securitySchemes:
    AccessTokenAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Signed access JWT only; must be valid, unexpired, not revoked and
        associated with the intended audience and issuer. Application scopes
        are declared using x-required-scopes because this is an HTTP bearer
        security scheme, not an OAuth2 scheme in OpenAPI.
    RefreshTokenAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Signed refresh JWT only; validated against server-maintained session
        and refresh-token rotation state. Never use refresh JWTs on resource APIs.
  schemas:
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          example: an@example.com
        password:
          type: string
          format: password
          minLength: 1
          description: Submitted only over HTTPS; never logged or returned.
          writeOnly: true
    TokenPair:
      type: object
      additionalProperties: false
      required: [access_token, refresh_token, token_type, expires_in]
      properties:
        access_token:
          type: string
          description: Signed JWT for protected API calls; 15-minute lifetime.
        refresh_token:
          type: string
          description: Rotating refresh JWT; maximum 30-day lifetime per session policy.
        token_type:
          type: string
          enum: [Bearer]
        expires_in:
          type: integer
          description: Access-token validity in seconds.
          example: 900
          minimum: 1
    Post:
      type: object
      additionalProperties: false
      required: [id, author_id, content, visibility, created_at]
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        author_id:
          type: string
          description: Public author identifier.
        content:
          type: string
        visibility:
          type: string
          enum: [public, private]
        created_at:
          type: string
          format: date-time
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error, message]
      properties:
        error:
          type: string
          description: Stable machine-readable error code.
        message:
          type: string
          description: Safe user-facing message without credentials or internal details.
  responses:
    RateLimited:
      description: Too many requests; rate limit applied to this operation.
      headers:
        Retry-After:
          description: Suggested seconds until the client may retry.
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { error: rate_limited, message: Too many requests. }
