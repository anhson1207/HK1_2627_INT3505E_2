# Self-contained local demo stack. Replace credentials for non-local environments.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: product_api
      POSTGRES_USER: app
      POSTGRES_PASSWORD: local_dev_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d product_api"]
      interval: 5s
      timeout: 3s
      retries: 15

  api:
    build: .
    ports:
      - "5001:5000"
    environment:
      DB_URL: postgresql+psycopg://app:local_dev_password@db:5432/product_api
      LOG_LEVEL: INFO
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
